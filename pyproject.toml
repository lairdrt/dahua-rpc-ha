[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dahua-rpc-ha"
version = "0.1.0"
description = "Home Assistant custom integration for dahua-rpc-sdk"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
